<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#160b35" />
    <title>Vibe Clash — 2D Fighter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="top-bar">
        <a class="brand" href="#">VIBE <span>CLASH</span></a>
        <button id="sound" class="icon-button" aria-label="Toggle sound">♫ ON</button>
      </header>

      <!-- Health, round count, and match score remain visible during combat. -->
      <section class="hud" aria-label="Fight status">
        <div class="fighter-hud player-hud">
          <small>MAYA <span id="p-wins">○○</span></small>
          <div class="health"><i id="p-health"></i></div>
          <b id="p-score">00</b>
        </div>
        <div class="round">
          <small>ROUND</small>
          <strong id="round-number">1</strong>
          <em id="timer">60</em>
        </div>
        <div class="fighter-hud enemy-hud">
          <small><span id="e-wins">○○</span> KAI</small>
          <div class="health"><i id="e-health"></i></div>
          <b id="e-score">00</b>
        </div>
      </section>

      <!-- The canvas is the stage; game.js draws the arena and characters. -->
      <canvas id="game" aria-label="Vibe Clash fighting game"></canvas>

      <aside class="move-list" aria-label="Keyboard controls">
        <span><kbd>A</kbd><kbd>D</kbd> MOVE</span>
        <span><kbd>J</kbd> PUNCH</span>
        <span><kbd>K</kbd> KICK</span>
        <span><kbd>L</kbd> BLOCK</span>
      </aside>

      <!-- These controls mirror the keyboard actions for mobile players. -->
      <section class="touch-controls" aria-label="Touch controls">
        <div class="dpad">
          <button data-key="a" aria-label="Move left">◀</button>
          <button data-key="d" aria-label="Move right">▶</button>
        </div>
        <div class="actions">
          <button data-key="j">PUNCH</button>
          <button data-key="k">KICK</button>
          <button data-key="l">BLOCK</button>
        </div>
      </section>

      <section id="start-screen" class="overlay">
        <p class="eyebrow">THE GROUP CHAT IS WATCHING</p>
        <h1>VIBE<br /><em>CLASH.</em></h1>
        <p>Read the energy. Throw hands. Win the round before the timer hits zero.</p>
        <button id="play" class="primary">ENTER THE ARENA</button>
        <p class="tip">A / D to move · J punch · K kick · L block</p>
      </section>

      <section id="result-screen" class="overlay hidden">
        <p class="eyebrow" id="result-label">MATCH COMPLETE</p>
        <h1 id="result-title">YOU<br /><em>ATE.</em></h1>
        <p id="result-copy">Clean work. Run it back?</p>
        <button id="retry" class="primary">REMATCH</button>
        <button id="share" class="secondary">BRAG ABOUT IT</button>
      </section>
    </main>
    <script src="game.js"></script>
  </body>
</html>
